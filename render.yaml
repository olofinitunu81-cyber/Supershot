# One-click deploy on Render (https://render.com) — a single web service with a persistent disk.
services:
  - type: web
    name: supershot
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /data
    disk:
      name: supershot-data
      mountPath: /data
      sizeGB: 1
